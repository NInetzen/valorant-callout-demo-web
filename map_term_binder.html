function norm(a,b,m){const x1=Math.max(0,Math.min(a.x,b.x)),y1=Math.max(0,Math.min(a.y,b.y)),x2=Math.min(m.width,Math.max(a.x,b.x)),y2=Math.min(m.height,Math.max(a.y,b.y)); return {x:+(x1/m.width).toFixed(6),y:+(y1/m.height).toFixed(6),w:+((x2-x1)/m.width).toFixed(6),h:+((y2-y1)/m.height).toFixed(6)}}
function den(r,m){return {x:r.x*m.width,y:r.y*m.height,w:r.w*m.width,h:r.h*m.height}}
function renderSelectors(){
  $("imageSelect").innerHTML=state.images.map(x=>`<option value="${x.id}" ${x.id===currentImageId?'selected':''}>${esc(x.name)}${x.note?'｜重复待确认':''}</option>`).join("");
  $("knowledgeMapSelect").innerHTML=TERMS.maps.map(m=>`<option value="${esc(m.mapName)}" ${m.mapName===currentKnowledgeMap?'selected':''}>${esc(m.mapName)}（${m.regionCount} 区域）</option>`).join("");
}
function renderTerms(){
  const q=$("termSearch").value.trim().toLowerCase(); let list=mapTerms(); if(q) list=list.filter(t=>(t.fullName+t.regionType+t.preview).toLowerCase().includes(q));
  $("termCount").textContent=list.length; $("knowledgeCount").textContent=mapTerms().reduce((s,t)=>s+t.knowledgeCount,0); $("bindCount").textContent=imgState().bindings.length;
  $("termList").innerHTML=list.length?list.map(t=>`<div class="term ${t.id===selectedTermId?'active':''}" data-id="${esc(t.id)}"><b>${esc(t.fullName)}</b><span class="tag">${esc(t.regionType)}</span><span class="tag">${t.knowledgeCount} 条知识</span><div class="preview">${esc(t.preview||'暂无预览')}</div></div>`).join(""):`<div class="empty">没有匹配词条</div>`;
  document.querySelectorAll(".term[data-id]").forEach(e=>e.onclick=()=>{selectedTermId=e.dataset.id; selectedBindingId=null; renderAll();});
  const t=termById(selectedTermId); $("selectedTermBox").innerHTML=t?`<div><span class="pill">已选择</span></div><h3 style="margin:8px 0 6px;font-size:16px">${esc(t.fullName)}</h3><p style="margin:0 0 8px;color:#bbb;font-size:12px">${esc(t.regionType)}｜${t.knowledgeCount} 条知识</p><p style="margin:0;color:#d8d4dc;font-size:12px;line-height:1.65">${esc(t.preview||'')}</p>`:`还没选词条。先在左侧点一个区域词条。`;
}
function renderStage(){
  const b=baseImg(), s=imgState(); $("title").textContent=`${s.name}  ⇄  ${currentKnowledgeMap||'未选知识库地图'}`; $("subtitle").textContent=`${b.width} × ${b.height}。选词条后拖拽框选区域，系统会绑定 Excel 全部知识。`;
  const src=useClean?b.cleanImage:b.image; const im=$("mapImage"); im.src=src; im.style.width=b.width*scale+"px"; im.style.height=b.height*scale+"px"; const st=$("stage"); st.style.width=b.width*scale+"px"; st.style.height=b.height*scale+"px"; const svg=$("overlay"); svg.setAttribute("viewBox",`0 0 ${b.width} ${b.height}`); svg.style.width=b.width*scale+"px"; svg.style.height=b.height*scale+"px";
  svg.innerHTML=s.bindings.map(r=>{const d=den(r,b);return `<g data-id="${r.id}"><rect class="rect ${r.id===selectedBindingId?'selected':''}" data-type="${esc(r.regionType)}" x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="4"></rect><text class="label" x="${d.x+6}" y="${d.y+18}">${esc(r.regionName)}</text></g>`}).join("");
  svg.querySelectorAll("g[data-id]").forEach(g=>g.addEventListener("mousedown",e=>{e.stopPropagation(); selectedBindingId=g.dataset.id; const bind=s.bindings.find(x=>x.id===selectedBindingId); selectedTermId=bind?.termId||selectedTermId; renderAll();}));
}
function renderBindings(){const binds=imgState().bindings; $("bindingList").innerHTML=binds.length?binds.map((b,i)=>`<div class="binding ${b.id===selectedBindingId?'active':''}" data-id="${b.id}"><b>${i+1}. ${esc(b.fullName)}</b><span class="tag">${esc(b.regionType)}</span><span class="tag">${b.knowledgeCount} 条知识</span></div>`).join(""):`<div class="empty">当前图片还没有绑定区域。</div>`; document.querySelectorAll(".binding[data-id]").forEach(e=>e.onclick=()=>{selectedBindingId=e.dataset.id; const bind=binds.find(x=>x.id===selectedBindingId); selectedTermId=bind?.termId||selectedTermId; renderAll();}); $("deleteBtn").disabled=!selectedBindingId;}
function renderAll(){renderSelectors(); renderTerms(); renderStage(); renderBindings();}
$("imageSelect").onchange=e=>{currentImageId=e.target.value; const km=imgState().knowledgeMapName; if(km) currentKnowledgeMap=km; selectedBindingId=null; renderAll()};
$("knowledgeMapSelect").onchange=e=>{currentKnowledgeMap=e.target.value; push(); imgState().knowledgeMapName=currentKnowledgeMap; selectedTermId=null; save()};
$("termSearch").oninput=renderTerms; $("toggleBaseBtn").onclick=()=>{useClean=!useClean; renderStage(); toast(useClean?'已切换到底图资源':'已切换到原图')}; $("renameBtn").onclick=()=>{push(); imgState().name=currentKnowledgeMap; imgState().knowledgeMapName=currentKnowledgeMap; save(); toast('已用知识库地图名命名')};
$("overlay").addEventListener("mousedown",e=>{if(e.button!==0)return; if(!selectedTermId){toast('先选择一个 Excel 词条');return;} drawing={start:pointer(e),end:pointer(e)}; selectedBindingId=null; renderStage();});
window.addEventListener("mousemove",e=>{if(!drawing)return; drawing.end=pointer(e); renderStage(); const b=baseImg(),r=norm(drawing.start,drawing.end,b),d=den(r,b),draft=document.createElementNS("http://www.w3.org/2000/svg","rect"); draft.setAttribute("class","draft"); draft.setAttribute("x",d.x);draft.setAttribute("y",d.y);draft.setAttribute("width",d.w);draft.setAttribute("height",d.h);draft.setAttribute("rx",4);$("overlay").appendChild(draft);});
window.addEventListener("mouseup",()=>{if(!drawing)return; const b=baseImg(),r=norm(drawing.start,drawing.end,b); drawing=null; if(r.w<.006||r.h<.006){renderAll();return;} const t=termById(selectedTermId); if(!t){toast('词条不存在');return;} push(); const bind={id:uid(), imageMapId:currentImageId, imageName:imgState().name, knowledgeMapName:t.mapName, termId:t.id, fullName:t.fullName, regionName:t.regionName, regionType:t.regionType, knowledgeCount:t.knowledgeCount, x:r.x,y:r.y,w:r.w,h:r.h, attachedKnowledge:t.knowledge}; imgState().knowledgeMapName=t.mapName; imgState().bindings.push(bind); selectedBindingId=bind.id; save(); toast('已绑定：'+t.fullName);});
$("deleteBtn").onclick=()=>{if(!selectedBindingId)return; push(); imgState().bindings=imgState().bindings.filter(x=>x.id!==selectedBindingId); selectedBindingId=null; save(); toast('已删除绑定')}; $("clearCurrentBtn").onclick=()=>{if(!confirm('确定清空当前图片的全部绑定？'))return; push(); imgState().bindings=[]; selectedBindingId=null; save(); toast('已清空当前图')}; $("undoBtn").onclick=()=>{const last=history.pop(); if(!last){toast('没有可撤销操作');return;} state=JSON.parse(last); localStorage.setItem(STORE_KEY,JSON.stringify(state)); selectedBindingId=null; renderAll(); toast('已撤销')};
$("zoomIn").onclick=()=>{scale=Math.min(1.8,+(scale+.1).toFixed(2));renderStage()}; $("zoomOut").onclick=()=>{scale=Math.max(.25,+(scale-.1).toFixed(2));renderStage()}; $("zoomReset").onclick=()=>{scale=1;renderStage()};
$("exportBtn").onclick=()=>{const payload={...state, exportedAt:new Date().toISOString(), sourceTerms:{schemaVersion:TERMS.schemaVersion,source:TERMS.source,mapCount:TERMS.mapCount,regionCount:TERMS.regionCount,knowledgeCount:TERMS.knowledgeCount}}; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='valorant_map_term_bindings.json'; a.click(); URL.revokeObjectURL(a.href);};
renderAll();
</script>
</body>
</html>
